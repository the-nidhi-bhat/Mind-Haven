<!DOCTYPE html>
<html lang="en">

<head>
    <script src="auth.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Flip | Mindful Haven</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="memory-flip.css">
</head>

<body>
    <nav>
        <a href="journey.html" class="logo">
            <i class="fas fa-brain"></i> Mindful Haven
        </a>
        <div class="nav-right">
            <a href="games.html" class="btn-back">Back to Games</a>
        </div>
    </nav>

    <div class="game-container">
        <div class="header-section">
            <h1>Memory Flip</h1>
            <p>Exercise your short-term memory by matching pairs of calming icons.</p>
        </div>

        <div class="stats-bar">
            <!--- Moves -->
            <div class="stat-box">
                <span class="label">Moves</span>
                <span class="value" id="moveCount">0</span>
            </div>
            <!--- Time (optional, keep it simple) -->
            <div class="stat-box">
                <span class="label">Pairs</span>
                <span class="value"><span id="pairsFound">0</span> / 8</span>
            </div>
            <!--- Restart -->
            <button class="btn-restart" onclick="initGame()">
                <i class="fas fa-redo"></i> Restart
            </button>
        </div>

        <div class="memory-grid" id="gameGrid">
            <!-- Cards generated by JS -->
        </div>

        <div class="message-area" id="messageArea">
            Find all matching pairs!
        </div>
    </div>

    <!-- Win Modal -->
    <div id="winModal" class="modal hidden">
        <div class="modal-content">
            <h2><i class="fas fa-star" style="color:var(--accent)"></i> Wonderful!</h2>
            <p>You completed the memory challenge.</p>
            <div class="score-summary">
                <p>Moves taken: <strong id="finalMoves">0</strong></p>
            </div>
            <button class="btn-primary" onclick="initGame(); closeModal()">Play Again</button>
            <button class="btn-secondary" onclick="window.location.href='games.html'">Exit</button>
        </div>
    </div>

    <script src="memory-flip.js"></script>
</body>

</html>
